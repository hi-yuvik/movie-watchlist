<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watchlist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <nav id = "navbar" class="navbar">
                <a class = "logo" href = "/">Logo</a>

                <ul class = "nav-menu">
                    <li><a href = "index.html">Dashboard</a></li>
                    <li><a href = "watchlist.html" class = "active">Watchlist</a></li>
                    <li><a href = "insights.html">Insights</a></li>
                </ul>

                <!-- 
                <div class = "nav-actions">
                    <button class = "login-btn">Login</button>

                    <button class = "menu-toggle" aria-label="Open Menu">☰</button>
                </div> 
                -->
                
            </nav>
        </header>

        <!-- Watchlist Section -->

        <section class="wlpage-section wllist-header" id="watchlist">

            <div class="wlpage-content wlpage-header">
                <h1 class="wl-title">Watchlist</h1>
                <p class="wl-subtitle">
                    Your complete list of movies and shows
                </p>
            </div>

            <div class="wlpage-block">

                <!-- Add Movie -->
                <section class="add-movie" aria-labelledby="add-movie-title">

                    <h2>
                        Add to Watchlist
                    </h2>
                    
                    <form id="add-movie-form" class = "add-movie-form">
                        <div class="movie-input-group">
                            <label for="movie-input">
                                Movie or show title
                            </label>
                            <input
                                type="text"
                                id="movie-input"
                                name="movie"
                                placeholder="Enter a movie or show..."
                                autocomplete="off"
                                required>
                        </div>

                        <div class="poster-input-group">
                            <h3 class = "movie-poster">Upload Poster</h3>
                            
                            <label for="poster-input" class = "poster-upload-box">
                                <span class = "dragdrop-text">Drag &  drop to upload or</span>

                                <span class = "upload-text">+ Choose files</span>
                            </label>

                            <input
                                type="file"
                                id="poster-input"
                                name="poster"
                                accept="image/*"
                            >
                        </div>

                        <button
                            type="submit" class = "add-movie-btn"
                            id="add-movie-btn">
                            Add Movie
                        </button>
                    </form>
                </section>

                <!-- Watchlist Header -->
                <section
                    class="mywatchlist-section"
                    aria-labelledby="watchlist-list-title">

                    <div class="watchlist-content">
                        <h2>
                            My Watchlist
                        </h2>

                        <div
                            class="filters-btn"
                            aria-label="Watchlist filter">

                            <button
                                type="button"
                                class="wl-filtersbtn active"
                                data-filter="all">
                                All
                            </button>

                            <button
                                type="button"
                                class="wl-filtersbtn"
                                data-filter="watched">
                                Watched
                            </button>

                            <button
                                type="button"
                                class="wl-filtersbtn"
                                data-filter="unwatched">
                                Unwatched
                            </button>
                        </div>
                    </div>

                    <!-- Search Bar in Watchlist Section -->

                    <div class = "search-container">

                        <input type = "text" class = "search-bar" name = "search-bar" placeholder="Search for a movie...">

                        <button type = "button" class = "search-btn">
                            <svg 
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">

                                <path d="m21 21-4.34-4.34"/>
                                
                                <circle cx="11" cy="11" r="8"/>

                            </svg>

                            <p>Search</p>
                            
                        </button>
                    </div>

                    <!-- Movie Cards -->
                    <div
                        class="movie-poster-cards"
                        id="movie-poster-cards"
                        aria-live="polite">
                        <!-- JavaScript generates movie cards here -->
                    </div>

                    <!-- Empty Watchlist -->
                    <div
                        class="watchlist-empty"
                        id="watchlist-empty"
                        hidden>

                        <div class = "watchlist-empty-content">
                            <h2>
                            Your watchlist is empty
                            </h2>
                            <p>
                                Add a movie or show to get started.
                            </p>
                        </div>

                        <button type = "button" id = "empty-add-btn">
                            Add a movie
                        </button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
