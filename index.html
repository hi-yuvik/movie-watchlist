<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "style.css">
    <title>Movie Watchlist</title>
</head>
<body>
    <main>
        <!-- Navigation Bar-->

        <header>
            <nav id = "navbar" class="navbar">
                <a class = "logo" href = "/">Logo</a>

                <ul class = "nav-menu">
                    <li><a href = "index.html" class = "active">Dashboard</a></li>
                    <li><a href = "watchlist.html">Watchlist</a></li>
                    <li><a href = "insights.html">Insights</a></li>
                </ul>

                <div class = "nav-actions">
                    <button class = "login-btn">Login</button>

                    <button class = "menu-toggle" aria-label="Open Menu">☰</button>
                </div>
            </nav>
        </header>

        <!-- Dashboard Section -->

        <section id = "dashboard-section" class = "dashboard-section">
            <div id = "dashboard-container" class = "dashboard-container">
                <div class = "dbstats-block">
                    <div class = "dbtext-block">
                        <h1 class = "dashboard-title">Your Movie Collection</h1>
                        <p class = "dashboard-subtitle">Keep track of what you've watched and what's next</p>
                    </div>

                    <div class = "movie-stats-cards">
                        <article class = "movie-stat-card">
                            <h3>Total Movies</h3>
                            <p></p>
                        </article>
                        <article class = "movie-stat-card">
                            <h3>Watched</h3>
                            <p></p>
                        </article>
                        <article class = "movie-stat-card">
                            <h3>To Watch</h3>
                            <p></p>
                        </article>
                    </div>
                </div>
            </div>
        </section>


        <!-- Watchlist Section -->

        <section id = "watchlist-section" class = "watchlist-section">
            <div id = "watchlist-container" class = "watchlist-container">

                <div class="watchlist-content">
                    <div class = "watchlist-header">
                        <h2>My Watchlist</h2>
                        <p class = "wl-subtitle">Your complete list of shows</p>
                    </div>

                    <a href="watchlist.html" class="seeall-btn">
                        See All
                    </a>
                </div>

                <div class="movie-poster-cards" id="movie-poster-cards">
                    <!-- JavaScript generates movie cards here -->
                </div>
            </div>
        </section>
    </main>

    <script src = "script.js"></script>
</body>
</html>
